<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
  <defs>
    <linearGradient id="forgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.55" stop-color="#111311"/>
      <stop offset="1" stop-color="#080908"/>
    </linearGradient>
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4f6fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4f6fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="forgeChart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4f6fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="forgeGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#forgeBg)"/>
  <circle cx="1010" cy="520" r="480" fill="url(#forgeGlow)"/>

  <g stroke="#f1ede4" stroke-opacity="0.06">
    <line x1="0" y1="110" x2="1400" y2="110"/>
    <line x1="0" y1="950" x2="1400" y2="950"/>
    <line x1="90" y1="0" x2="90" y2="1050"/>
    <line x1="1310" y1="0" x2="1310" y2="1050"/>
    <line x1="700" y1="0" x2="700" y2="1050"/>
  </g>

  <text x="90" y="140" fill="#f1ede4" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="4">FORGE</text>
  <rect x="225" y="118" width="86" height="28" fill="#4f6fff"/>
  <text x="268" y="137" fill="#08080a" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="2" text-anchor="middle">V2.4</text>
  <text x="1130" y="136" fill="#4f6fff" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3">SYSTEM ONLINE</text>
  <circle cx="1108" cy="132" r="4" fill="#4f6fff"/>

  <text x="90" y="330" fill="#f1ede4" font-family="Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="-3">Operations,</text>
  <text x="90" y="424" fill="#f1ede4" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-style="italic" letter-spacing="-3">in one place.</text>
  <text x="94" y="484" fill="#f1ede4" fill-opacity="0.4" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4">CUSTOM PLATFORM / DASHBOARDS / AUTOMATION</text>

  <g transform="translate(90 560)">
    <rect width="560" height="360" fill="#f1ede4" fill-opacity="0.03" stroke="#f1ede4" stroke-opacity="0.1"/>
    <text x="28" y="40" fill="#f1ede4" fill-opacity="0.4" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3">MONTHLY REVENUE</text>
    <text x="28" y="92" fill="#f1ede4" font-family="Georgia, 'Times New Roman', serif" font-size="46">$284,920</text>
    <text x="476" y="86" fill="#4f6fff" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">+24.8%</text>
    <line x1="28" y1="120" x2="532" y2="120" stroke="#f1ede4" stroke-opacity="0.08"/>
    <g>
      <rect x="28" y="220" width="40" height="82" fill="#f1ede4" fill-opacity="0.12"/>
      <rect x="82" y="196" width="40" height="106" fill="#f1ede4" fill-opacity="0.12"/>
      <rect x="136" y="238" width="40" height="64" fill="#f1ede4" fill-opacity="0.12"/>
      <rect x="190" y="176" width="40" height="126" fill="#f1ede4" fill-opacity="0.12"/>
      <rect x="244" y="204" width="40" height="98" fill="#4f6fff"/>
      <rect x="298" y="156" width="40" height="146" fill="#f1ede4" fill-opacity="0.12"/>
      <rect x="352" y="188" width="40" height="114" fill="#f1ede4" fill-opacity="0.12"/>
      <rect x="406" y="142" width="40" height="160" fill="#f1ede4" fill-opacity="0.12"/>
      <rect x="460" y="166" width="40" height="136" fill="#f1ede4" fill-opacity="0.12"/>
    </g>
    <text x="28" y="336" fill="#f1ede4" fill-opacity="0.3" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2">JAN — SEP 2026</text>
  </g>

  <g transform="translate(700 560)">
    <rect width="610" height="360" fill="#f1ede4" fill-opacity="0.03" stroke="#f1ede4" stroke-opacity="0.1"/>
    <text x="28" y="40" fill="#f1ede4" fill-opacity="0.4" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3">ACTIVE WORKFLOWS</text>
    <g font-family="Helvetica, Arial, sans-serif">
      <text x="28" y="92" fill="#f1ede4" font-size="15">Inventory sync</text>
      <rect x="28" y="108" width="430" height="3" fill="#f1ede4" fill-opacity="0.1"/>
      <rect x="28" y="108" width="382" height="3" fill="#4f6fff"/>
      <text x="540" y="96" fill="#4f6fff" font-size="10" text-anchor="end">89%</text>

      <text x="28" y="156" fill="#f1ede4" font-size="15">Order routing</text>
      <rect x="28" y="172" width="430" height="3" fill="#f1ede4" fill-opacity="0.1"/>
      <rect x="28" y="172" width="298" height="3" fill="#8f9bf5"/>
      <text x="540" y="160" fill="#8f9bf5" font-size="10" text-anchor="end">72%</text>

      <text x="28" y="220" fill="#f1ede4" font-size="15">Partner API</text>
      <rect x="28" y="236" width="430" height="3" fill="#f1ede4" fill-opacity="0.1"/>
      <rect x="28" y="236" width="344" height="3" fill="#ff8b6b"/>
      <text x="540" y="224" fill="#ff8b6b" font-size="10" text-anchor="end">81%</text>
    </g>
    <line x1="28" y1="274" x2="582" y2="274" stroke="#f1ede4" stroke-opacity="0.08"/>
    <text x="28" y="310" fill="#f1ede4" fill-opacity="0.35" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2">18 EVENTS PROCESSED THIS MINUTE</text>
    <text x="582" y="310" fill="#4f6fff" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" text-anchor="end">ALL SYSTEMS NOMINAL</text>
  </g>

  <text x="90" y="1000" fill="#f1ede4" fill-opacity="0.3" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4">CUSTOM WEB APPLICATION — 2024</text>
  <text x="1310" y="1000" fill="#f1ede4" fill-opacity="0.3" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4" text-anchor="end">FORGE / OPERATIONS OS</text>

  <rect width="1400" height="1050" filter="url(#forgeGrain)" opacity="0.9"/>
</svg>
